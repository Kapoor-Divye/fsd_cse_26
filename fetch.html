<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Page Info</title>
</head>
<body>
    <h1>
        Github Page Info
    </h1>

    <label for="username">
        Enter your github username:
    </label>
    <input type="text" id="username" placeholder="Enter your github username">

    <button onclick="loadUser(document.getElementById('username').value)">
        Get Info
    </button>

    <div>
        <h2>
            Name:
        </h2>
        <p id="name"></p>
        <h2>
            Bio:
        </h2>
        <p id="bio"></p>
        <h2>
            Avatar:
        </h2>
        <img id="avatar" src="">
    </div>

    <script src="fetch.js"></script>
</body>
</html>
